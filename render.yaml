# Render Blueprint for Tenor (free tier, $0).
# Render's Blueprint flow reads THIS file from the REPO ROOT on the main branch.
# In Render: New > Blueprint > pick this repo. Then set DEEPSEEK_API_KEY (marked
# sync:false, so it is never committed) in the dashboard when prompted.
#
# One service. The agent panel runs as Next route handlers rather than a separate
# API, because a debate is three sequential model calls and needs a long-lived
# server, which is exactly what a Render web service is.
services:
  - type: web
    name: tenor
    runtime: node
    plan: free
    # Build from the REPO ROOT so the npm workspaces resolve; the agents package is
    # a workspace dependency of web and ships TypeScript that Next transpiles.
    rootDir: .
    # --include=dev is deliberate: typescript and the @types packages are devDependencies
    # and `next build` needs them. If the platform sets NODE_ENV=production, a plain
    # `npm ci` would skip them and the build would fail on a missing typescript.
    buildCommand: npm ci --include=dev && npm run build --workspace web
    startCommand: npm run start --workspace web
    # Cheap, always-200, and it exercises the workspace import chain rather than just
    # proving the process is alive.
    healthCheckPath: /api/samples
    envVars:
      # Next 16 needs 20.9+; pin so a Render default bump cannot break the build.
      - key: NODE_VERSION
        value: "22"
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: SUPABASE_URL
        value: https://svbqoplujdigkbmwxvib.supabase.co
      # Publishable by design: it can only read the rows RLS already makes public, which is
      # the verdict reasoning anyone is invited to re-hash. Safe to commit.
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_dOstlitdBB0idA3B9sr43g_jsnbsCaQ
      # Set these in the dashboard. Never commit them.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
